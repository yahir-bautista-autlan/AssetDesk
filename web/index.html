<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Gestión de inventarios y responsivas de equipos.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="assetdesk_">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>assetdesk_</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      background-color: #FFFFFF;
    }
  </style>
  <script>
    (function () {
      function aplicar() {
        var meta = document.querySelector('meta[name="theme-color"]');
        if (!meta) return;
        var color = meta.getAttribute('content');
        if (!color) return;
        document.documentElement.style.backgroundColor = color;
        if (document.body) document.body.style.backgroundColor = color;
      }
      new MutationObserver(aplicar).observe(document.head, {
        subtree: true,
        childList: true,
        attributes: true,
        attributeFilter: ['content']
      });
      document.addEventListener('DOMContentLoaded', aplicar);
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
