<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Gestión de inventarios y responsivas de equipos.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="assetdesk_">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>assetdesk_</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      background-color: #FFFFFF;
    }
  </style>
  <script>
    (function () {
      var enApp = window.navigator.standalone === true ||
        (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
      if (!enApp) return;

      var borde = 24;
      var minimo = 70;
      var inicio = null;

      document.addEventListener('touchstart', function (e) {
        var t = e.touches[0];
        if (e.touches.length === 1 && t.clientX <= borde) {
          inicio = { x: t.clientX, y: t.clientY };
          e.preventDefault();
        } else {
          inicio = null;
        }
      }, { passive: false, capture: true });

      document.addEventListener('touchend', function (e) {
        if (!inicio) return;
        var t = e.changedTouches[0];
        var dx = t.clientX - inicio.x;
        var dy = Math.abs(t.clientY - inicio.y);
        inicio = null;
        if (dx > minimo && dy < dx * 0.6) history.back();
      }, { passive: true, capture: true });

      document.addEventListener('touchcancel', function () {
        inicio = null;
      }, { passive: true, capture: true });
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
